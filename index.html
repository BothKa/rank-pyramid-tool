<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>六大關卡定位系統</title>
    <link rel="stylesheet" href="./styles.css?v=20260606-capped-units" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="階級定位計算工具">
        <aside class="input-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">六大關卡</p>
              <h1>關卡階梯</h1>
            </div>
            <button class="ghost-button" id="resetExample" type="button">範例</button>
          </div>

          <form id="rankForm" autocomplete="off">
            <section class="form-section control-panel" aria-labelledby="settingsHeading" hidden>
              <div class="section-title plain">
                <h2 id="settingsHeading">檢視</h2>
              </div>

              <div class="control-stack">
                <div class="control-row">
                  <span class="control-label">視角</span>
                  <div class="segmented-control" role="radiogroup" aria-label="視角">
                    <label>
                      <input data-setting="viewMode" name="viewMode" type="radio" value="leader" />
                      <span>隊長</span>
                    </label>
                    <label>
                      <input data-setting="viewMode" name="viewMode" type="radio" value="member" />
                      <span>隊員</span>
                    </label>
                  </div>
                </div>

                <label class="field-label member-picker">
                  <span>隊員</span>
                  <select id="viewerMember"></select>
                </label>

                <div class="control-row">
                  <span class="control-label">自己輪迴</span>
                  <div class="segmented-control" role="radiogroup" aria-label="自己輪迴">
                    <label>
                      <input data-setting="leaderCycleBasis" name="leaderCycleBasis" type="radio" value="sum" />
                      <span>加總</span>
                    </label>
                    <label>
                      <input data-setting="leaderCycleBasis" name="leaderCycleBasis" type="radio" value="max" />
                      <span>單筆</span>
                    </label>
                  </div>
                </div>

                <div class="control-row">
                  <span class="control-label">團隊輪迴</span>
                  <div class="segmented-control" role="radiogroup" aria-label="團隊輪迴">
                    <label>
                      <input data-setting="teamCycleBasis" name="teamCycleBasis" type="radio" value="coverage" />
                      <span>配置</span>
                    </label>
                    <label>
                      <input data-setting="teamCycleBasis" name="teamCycleBasis" type="radio" value="amount" />
                      <span>金額</span>
                    </label>
                  </div>
                </div>
              </div>
            </section>

            <section class="form-section leader-edit" aria-label="關卡單位輸入">
              <div class="section-title" hidden>
                <h2 id="leaderHeading">隊長</h2>
              </div>
              <label class="field-label" hidden>
                <span>姓名</span>
                <input id="leaderName" name="leaderName" type="text" />
              </label>
              <div class="leader-unit-grid" id="leaderUnitCounts"></div>
              <div class="amount-list" id="leaderAmounts" hidden></div>
            </section>

            <aside class="mobile-status" id="mobileStatus" aria-live="polite"></aside>

            <section class="form-section team-edit" aria-labelledby="membersHeading" hidden>
              <div class="section-title">
                <h2 id="membersHeading">隊員</h2>
                <button class="icon-button" data-action="add-member" type="button" title="新增隊員" aria-label="新增隊員">+</button>
              </div>
              <div class="member-list" id="members"></div>
            </section>
          </form>
        </aside>

        <section class="output-panel">
          <section class="status-overview" id="statusOverview" aria-live="polite"></section>
          <div class="result-strip" id="summary"></div>

          <section class="phase-panel" aria-labelledby="phaseHeading">
            <div class="section-title plain">
              <div>
                <p class="eyebrow">段數 PASS</p>
                <h2 id="phaseHeading">五段數通過狀態</h2>
              </div>
            </div>
            <div class="phase-lights" id="phaseLights"></div>
          </section>

          <section class="journey-panel" aria-labelledby="journeyHeading">
            <div class="section-title plain">
              <div>
                <p class="eyebrow">關卡階梯</p>
                <h2 id="journeyHeading">下一步一眼看懂</h2>
              </div>
            </div>
            <div class="gate-stepper" id="gateStepper"></div>
          </section>

          <section class="decision-grid" hidden>
            <article class="action-panel" aria-labelledby="actionHeading">
              <div class="section-title plain">
                <div>
                  <p class="eyebrow">行動缺口</p>
                  <h2 id="actionHeading">現在要補哪裡</h2>
                </div>
              </div>
              <div class="action-list" id="actionList"></div>
            </article>

            <article class="flow-panel team-only" aria-labelledby="flowHeading">
              <div class="section-title plain">
                <div>
                  <p class="eyebrow">瀑布補額</p>
                  <h2 id="flowHeading">金額怎麼往上推</h2>
                </div>
              </div>
              <div class="waterfall" id="waterfall"></div>
            </article>
          </section>

          <section class="pyramid-frame" aria-labelledby="pyramidHeading" hidden>
            <div class="panel-head compact">
              <div>
                <p class="eyebrow">圖像模式</p>
                <h2 id="pyramidHeading">三角形定位</h2>
              </div>
              <div class="legend" aria-label="圖例">
                <span><i class="legend-swatch solid"></i>實得</span>
                <span><i class="legend-swatch nominal"></i>先得</span>
                <span><i class="legend-swatch muted"></i>未觸及</span>
                <span><i class="legend-swatch personal"></i>個人</span>
              </div>
            </div>
            <div id="pyramid" class="pyramid-canvas"></div>
          </section>

          <section class="detail-grid" hidden>
            <details class="detail-panel cycle-panel team-only">
              <summary class="detail-summary">
                <span>五大輪迴明細</span>
                <small>展開完整條件</small>
              </summary>
              <div class="table-wrap">
                <table class="cycle-table">
                  <thead>
                    <tr>
                      <th>輪迴</th>
                      <th>關卡</th>
                      <th>通關條件</th>
                      <th>隊長自己</th>
                      <th>團隊</th>
                    </tr>
                  </thead>
                  <tbody id="cycleRows"></tbody>
                </table>
              </div>
            </details>

            <details class="detail-panel cascade-panel team-only">
              <summary class="detail-summary">
                <span>級聯計算明細</span>
                <small>展開補額表</small>
              </summary>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>關卡</th>
                      <th>狀態</th>
                      <th>隊員覆蓋</th>
                      <th>隊長補額</th>
                      <th>剩餘</th>
                    </tr>
                  </thead>
                  <tbody id="cascadeRows"></tbody>
                </table>
              </div>
            </details>

            <article class="detail-panel member-panel">
              <div class="section-title plain">
                <h2 id="memberPanelTitle">團隊定位</h2>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>隊員</th>
                      <th>最高金額</th>
                      <th>位置</th>
                      <th>個別輪迴</th>
                    </tr>
                  </thead>
                  <tbody id="memberRows"></tbody>
                </table>
              </div>
            </article>
          </section>
        </section>
      </section>
    </main>

    <template id="amountTemplate">
      <div class="amount-row">
        <input class="amount-input" inputmode="text" type="text" placeholder="金額（預設萬；可填 2.2億 / 100000000元）" />
        <button class="icon-button subtle remove-amount" type="button" title="移除金額" aria-label="移除金額">×</button>
      </div>
    </template>

    <template id="memberTemplate">
      <article class="member-item">
        <div class="member-head">
          <label class="field-label compact-field">
            <span>姓名</span>
            <input class="member-name" type="text" />
          </label>
          <div class="member-actions">
            <button class="icon-button subtle add-member-amount" type="button" title="新增隊員金額" aria-label="新增隊員金額">+</button>
            <button class="icon-button subtle remove-member" type="button" title="移除隊員" aria-label="移除隊員">×</button>
          </div>
        </div>
        <div class="amount-list member-amounts"></div>
        <div class="member-live-status" aria-live="polite"></div>
      </article>
    </template>

    <script src="./app.js?v=20260606-capped-units"></script>
  </body>
</html>
